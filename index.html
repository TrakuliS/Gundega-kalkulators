<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uztura Kalkulators</title>
    <style>
        :root {
            --bg-color: rgba(255, 255, 255, 0.85); /* Gaišs overlay fonam */
            --text-color: #333333;
            --input-bg: #f0f0f0;
            --button-bg: #007bff;
            --button-text: #ffffff;
            --accent: #4caf50;
            --shadow: rgba(0, 0, 0, 0.1);
        }
        body.dark-mode {
            --bg-color: rgba(18, 18, 18, 0.85); /* Tumšs overlay fonam */
            --text-color: #e0e0e0;
            --input-bg: #1e1e1e;
            --button-bg: #0d47a1;
            --accent: #66bb6a;
            --shadow: rgba(255, 255, 255, 0.1);
        }
        body {
            font-family: 'Arial', sans-serif;
            background-image: url('https://media.gettyimages.com/id/1455279498/photo/pattern-of-variety-fresh-of-organic-fruits-and-vegetables-and-healthy-vegan-meal-ingredients.jpg?s=612x612&w=gi&k=20&c=uKwCbjOybFk5f_LOdfQHxV-se3VJtyJDEwlt4FNEW6c=');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: var(--bg-color); /* Overlay lai lasāmība */
            background-blend-mode: multiply; /* Lai fons būtu subtīls */
            color: var(--text-color);
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            transition: background 0.3s, color 0.3s;
            min-height: 100vh; /* Lai fons aizpilda visu lapu */
        }
        h1 { text-align: center; margin-bottom: 30px; }
        form { display: flex; flex-direction: column; gap: 15px; }
        label { font-weight: bold; }
        input, select {
            padding: 10px;
            background: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--text-color);
            border-radius: 5px;
            transition: border 0.3s;
        }
        input:focus, select:focus { border-color: var(--accent); }
        button {
            background: var(--button-bg);
            color: var(--button-text);
            padding: 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }
        button:hover { background: #0056b3; }
        .result {
            margin-top: 30px;
            padding: 20px;
            background: var(--input-bg);
            border-radius: 10px;
            box-shadow: 0 4px 10px var(--shadow);
            animation: fadeIn 0.5s;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .toggle-container {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }
        .toggle {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }
        .toggle input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #ccc;
            transition: .4s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 20px; width: 20px;
            left: 2px; bottom: 2px;
            background: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider { background: var(--accent); }
        input:checked + .slider:before { transform: translateX(26px); }
        
        /* Slaidšovs stili */
        .slideshow-container {
            max-width: 100%;
            position: relative;
            margin: auto;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 10px var(--shadow);
        }
        .mySlides {
            display: none;
        }
        .mySlides img {
            width: 100%;
            height: auto;
            border-radius: 10px;
        }
        .prev, .next {
            cursor: pointer;
            position: absolute;
            top: 50%;
            width: auto;
            padding: 16px;
            margin-top: -22px;
            color: white;
            font-weight: bold;
            font-size: 18px;
            transition: 0.6s ease;
            border-radius: 0 3px 3px 0;
            user-select: none;
        }
        .next {
            right: 0;
            border-radius: 3px 0 0 3px;
        }
        .prev:hover, .next:hover {
            background-color: rgba(0,0,0,0.8);
        }
        .fade {
            animation-name: fade;
            animation-duration: 1.5s;
        }
        @keyframes fade {
            from {opacity: .4} 
            to {opacity: 1}
        }
        
        /* Responsīvs dizains */
        @media (max-width: 600px) {
            body { padding: 10px; }
            h1 { font-size: 24px; }
            button { font-size: 14px; }
        }
    </style>
</head>

            <span class="slider"></span>
        </label>
        <span style="margin-left: 10px;">Tumšais režīms</span>
    </div>
